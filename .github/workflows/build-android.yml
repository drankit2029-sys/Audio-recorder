name: Build Android Dev Client
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # M4: the workflow used to go straight from `npm ci` to a Gradle build, so
      # a broken type, a bad config plugin or an Expo version mismatch only
      # showed up as a confusing Gradle/Kotlin failure (or not at all).
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Expo doctor
        run: npx expo-doctor
        continue-on-error: true

      - name: Prebuild Native Project
        run: npx expo prebuild --platform android --clean

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
