name: Build iOS IPA (Unsigned)
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Archive (Unsigned)
        run: |
          cd ios
          xcodebuild archive \
            -workspace AudioRecorder.xcworkspace \
            -scheme AudioRecorder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AudioRecorder.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA for ESign
        run: |
          mkdir -p build/Payload
          cp -r ios/build/AudioRecorder.xcarchive/Products/Applications/AudioRecorder.app build/Payload/
          cd build
          zip -r AudioRecorder-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioRecorder-unsigned
          path: build/AudioRecorder-unsigned.ipa
          retention-days: 14