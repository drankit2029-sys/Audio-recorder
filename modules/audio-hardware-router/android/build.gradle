apply plugin: 'com.android.library'

android {
    compileSdk 36
    namespace "expo.modules.audiohardwarerouter"

    defaultConfig {
        // Matches RN 0.86's floor and MediaRecorder.pause()/resume() (API 24+).
        minSdk 24
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
}